{% extends 'accounts/base_dashboard.html' %}

{% block title %}Select Language{% endblock %}

{% block content %}

<div class="container mt-5 d-flex justify-content-center">

    <div class="card shadow-sm p-5 text-center" style="max-width:500px; width:100%;">

        <h3 class="mb-4">Select Programming Language</h3>

        <p class="text-muted mb-4">
            Choose the language you want to use for output-based questions
        </p>

        <form method="POST" action="{% url 'start_output_test' %}">
            {% csrf_token %}

            <div class="mb-4">
                <select name="language" class="form-select" required>
                    <option value="">-- Select Language --</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary px-4">
                Start Output Test
            </button>

        </form>

    </div>

</div>

{% endblock %}
